openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Core API for the Mallorca ecommerce storefront and admin.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Public catalog and branch operations
  - name: admin
    description: Internal catalog operations
  - name: storage
    description: Persistent file storage
paths:
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for an authenticated upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /branches:
    get:
      operationId: listBranches
      tags: [storefront]
      summary: List active branches
      responses:
        "200":
          description: Active Mallorca branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /branches/{slug}:
    get:
      operationId: getBranch
      tags: [storefront]
      summary: Get a branch and its available products
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
        "404":
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List catalog categories
      responses:
        "200":
          description: Catalog categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: List products for the storefront
      parameters:
        - name: branchSlug
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: scheduledStart
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeUnavailable
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Products filtered for the selected branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCard"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get a product with branch availability and variants
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          description: Branch used to resolve the current price of each variant
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get the admin overview metrics
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List products for catalog administration
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, inactive]
      responses:
        "200":
          description: Admin product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}/promotions:
    get:
      operationId: listProductPromotions
      tags: [admin]
      summary: List the promotion history for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Promotion history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionHistoryItem"
    post:
      operationId: createProductPromotion
      tags: [admin]
      summary: Schedule a promotion for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "201":
          description: Scheduled promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionHistoryItem"
        "400":
          description: Invalid promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Branch access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cart/session:
    post:
      operationId: createCartSession
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartSessionInput" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}:
    get:
      operationId: getCart
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}/branch-preview:
    post:
      operationId: previewCartBranch
      tags: [storefront]
      summary: Preview cart availability in another branch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPreviewInput" }
      responses:
        "200": { description: Cart branch change preview, content: { application/json: { schema: { $ref: "#/components/schemas/BranchPreview" } } } }
        "404":
          description: Cart or branch not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cart/{id}/items:
    post:
      operationId: addCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    delete:
      operationId: deleteCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /fulfillment/delivery-validation:
    post:
      operationId: validateDelivery
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryValidationInput" }
      responses:
        "200": { description: Delivery validation, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryValidation" } } } }
  /fulfillment/slots:
    get:
      operationId: listFulfillmentSlots
      tags: [storefront]
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: integer } }
        - { name: date, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: method, in: query, required: true, schema: { type: string, enum: [pickup, delivery] } }
        - { name: cartId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Slots, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FulfillmentSlot" } } } } }
  /fulfillment/preview:
    post:
      operationId: previewFulfillment
      tags: [storefront]
      summary: Revalidate cart products for a fulfillment date and slot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentPreviewInput" }
      responses:
        "200": { description: Fulfillment preview, content: { application/json: { schema: { $ref: "#/components/schemas/FulfillmentPreview" } } } }
        "409": { description: Fulfillment slot unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /orders:
    post:
      operationId: createOrder
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /orders/{id}/payment:
    post:
      operationId: startOrderPayment
      tags: [storefront]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentStartInput" }
      responses:
        "200": { description: Payment session, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStart" } } } }
        "503": { description: Payment provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStart" } } } }
  /orders/{id}:
    get:
      operationId: getOrderDetails
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /guest/orders/{id}/{token}:
    get:
      operationId: getGuestOrderDetails
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Guest order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /me:
    get:
      operationId: getMe
      tags: [storefront]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
    patch:
      operationId: updateMe
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [storefront]
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: branchId, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
  /admin/branches:
    get:
      operationId: listAdminBranches
      tags: [admin]
      responses:
        "200": { description: Branches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminBranch" } } } } }
  /admin/branches/{id}:
    get:
      operationId: getAdminBranch
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Branch detail tabs, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBranchDetail" } } } }
    patch:
      operationId: updateAdminBranch
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BranchUpdate" } } } }
      responses:
        "200": { description: Branch, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBranch" } } } }
  /admin/inventory:
    get:
      operationId: listAdminInventory
      tags: [admin]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: branchId, in: query, schema: { type: integer } }
        - { name: state, in: query, schema: { type: string, enum: [NORMAL, LOW_STOCK, OUT_OF_STOCK] } }
        - { name: categoryId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Inventory, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InventoryRow" } } } } }
  /admin/inventory/matrix:
    get:
      operationId: getInventoryMatrix
      tags: [admin]
      responses:
        "200": { description: Inventory matrix, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /admin/inventory/update:
    post:
      operationId: updateAdminInventory
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryUpdate" } } } }
      responses:
        "200": { description: Updated inventory, content: { application/json: { schema: { type: object } } } }
  /admin/inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [admin]
      responses:
        "200": { description: Movement history, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /admin/inventory/alerts:
    get:
      operationId: listInventoryAlerts
      tags: [admin]
      responses:
        "200": { description: Alert history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InventoryAlertRow" } } } } }
  /admin/inventory/import/preview:
    post:
      operationId: previewInventoryImport
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CsvImportInput" } } } }
      responses:
        "200": { description: Import preview, content: { application/json: { schema: { $ref: "#/components/schemas/ImportPreview" } } } }
  /admin/inventory/import:
    post:
      operationId: importInventory
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CsvImportInput" } } } }
      responses:
        "200": { description: Import result, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
  /admin/products/import/preview:
    post:
      operationId: previewProductImport
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImportInput"
      responses:
        "200":
          description: Product import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportPreview"
  /admin/products/import:
    post:
      operationId: importProducts
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImportInput"
      responses:
        "200":
          description: Product import result, including row-level errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportResult"
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusUpdate" }
      responses:
        "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200": { description: Safe staff directory, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SafeUser" } } } } }
  /admin/branches/{id}/assignments:
    get:
      operationId: listBranchAssignments
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Branch assignments, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    put:
      operationId: createBranchAssignment
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentInput" } } } }
      responses:
        "201": { description: Assignment, content: { application/json: { schema: { type: object } } } }
  /admin/branches/{id}/assignments/{userId}:
    delete:
      operationId: deleteBranchAssignment
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted } }
  /admin/category-responsibles:
    get:
      operationId: listCategoryResponsibles
      tags: [admin]
      parameters: [{ name: branchId, in: query, schema: { type: integer } }]
      responses:
        "200": { description: Category responsible contacts, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    put:
      operationId: upsertCategoryResponsible
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryResponsibleInput" } } } }
      responses:
        "200": { description: Assignment, content: { application/json: { schema: { type: object } } } }
  /admin/category-responsibles/{id}:
    delete:
      operationId: deleteCategoryResponsible
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /admin/reports/branches:
    get:
      operationId: getBranchReport
      tags: [admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Branch comparison, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BranchReport" } } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BranchHour:
      type: object
      properties:
        day:
          type: string
        label:
          type: string
        open:
          type: string
        close:
          type: string
        closed:
          type: boolean
        date:
          type: string
      required: [day, label, open, close, closed]
    Branch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        shortName:
          type: string
        description:
          type: ["string", "null"]
        address:
          type: string
        neighborhood:
          type: string
        borough:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        phone:
          type: string
        whatsapp:
          type: ["string", "null"]
        email:
          type: string
        mapsUrl:
          type: string
        openTableUrl:
          type: ["string", "null"]
        instagramUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        gallery:
          type: array
          items:
            type: string
        hours:
          type: array
          items:
            $ref: "#/components/schemas/BranchHour"
        pickupAvailable:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: ["number", "null"]
        minimumOrder:
          type: ["number", "null"]
        preparationTimeMinutes:
          type: integer
        deliveryTimeMinutes:
          type: integer
        active:
          type: boolean
      required:
        - id
        - name
        - slug
        - shortName
        - description
        - address
        - neighborhood
        - borough
        - city
        - state
        - postalCode
        - country
        - latitude
        - longitude
        - phone
        - whatsapp
        - email
        - mapsUrl
        - openTableUrl
        - instagramUrl
        - imageUrl
        - gallery
        - hours
        - pickupAvailable
        - deliveryAvailable
        - deliveryRadiusKm
        - minimumOrder
        - preparationTimeMinutes
        - deliveryTimeMinutes
        - active
    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/Branch"
