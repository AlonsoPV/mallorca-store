openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Core API for the Mallorca ecommerce storefront and admin.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Public catalog and branch operations
  - name: admin
    description: Internal catalog operations
  - name: storage
    description: Persistent file storage
paths:
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for an authenticated upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /branches:
    get:
      operationId: listBranches
      tags: [storefront]
      summary: List active branches
      responses:
        "200":
          description: Active Mallorca branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /branches/{slug}:
    get:
      operationId: getBranch
      tags: [storefront]
      summary: Get a branch and its available products
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
        "404":
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List catalog categories
      responses:
        "200":
          description: Catalog categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: List products for the storefront
      parameters:
        - name: branchSlug
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: seasonal
          in: query
          required: false
          schema:
            type: boolean
        - name: scheduledStart
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeUnavailable
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Products filtered for the selected branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCard"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get a product with branch availability and variants
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          description: Branch used to resolve the current price of each variant
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get the admin overview metrics
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List products for catalog administration
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, inactive]
      responses:
        "200":
          description: Admin product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get a catalog product for administration (any status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admin product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}/promotions:
    get:
      operationId: listProductPromotions
      tags: [admin]
      summary: List the promotion history for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Promotion history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionHistoryItem"
    post:
      operationId: createProductPromotion
      tags: [admin]
      summary: Schedule a promotion for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "201":
          description: Scheduled promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionHistoryItem"
        "400":
          description: Invalid promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Branch access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}/promotions/{promotionId}:
    patch:
      operationId: updateProductPromotion
      tags: [admin]
      summary: Edit a scheduled promotion for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: promotionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "200":
          description: Updated scheduled promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionHistoryItem"
        "400":
          description: Invalid promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Branch access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Promotion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Promotion is no longer editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}/promotions/{promotionId}/cancel:
    post:
      operationId: cancelProductPromotion
      tags: [admin]
      summary: Cancel a scheduled promotion before it starts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: promotionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionHistoryItem"
        "403":
          description: Branch access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Promotion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Promotion is no longer cancellable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cart/session:
    post:
      operationId: createCartSession
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartSessionInput" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}:
    get:
      operationId: getCart
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}/branch-preview:
    post:
      operationId: previewCartBranch
      tags: [storefront]
      summary: Preview cart availability in another branch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPreviewInput" }
      responses:
        "200": { description: Cart branch change preview, content: { application/json: { schema: { $ref: "#/components/schemas/BranchPreview" } } } }
        "404":
          description: Cart or branch not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cart/{id}/items:
    post:
      operationId: addCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemInput" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /cart/{id}/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemUpdate" }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    delete:
      operationId: deleteCartItem
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /fulfillment/delivery-validation:
    post:
      operationId: validateDelivery
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryValidationInput" }
      responses:
        "200": { description: Delivery validation, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryValidation" } } } }
  /fulfillment/slots:
    get:
      operationId: listFulfillmentSlots
      tags: [storefront]
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: integer } }
        - { name: date, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: method, in: query, required: true, schema: { type: string, enum: [pickup, delivery] } }
        - { name: cartId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Slots, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FulfillmentSlot" } } } } }
  /fulfillment/preview:
    post:
      operationId: previewFulfillment
      tags: [storefront]
      summary: Revalidate cart products for a fulfillment date and slot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentPreviewInput" }
      responses:
        "200": { description: Fulfillment preview, content: { application/json: { schema: { $ref: "#/components/schemas/FulfillmentPreview" } } } }
        "409": { description: Fulfillment slot unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /checkout/payment-methods:
    get:
      operationId: listCheckoutPaymentMethods
      tags: [storefront]
      summary: Payment methods available for this branch and fulfillment
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: integer } }
        - { name: fulfillmentMethod, in: query, required: true, schema: { type: string, enum: [pickup, delivery] } }
      responses:
        "200": { description: Methods, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CheckoutPaymentMethod" } } } } }
  /orders/preview:
    post:
      operationId: previewOrder
      tags: [storefront]
      summary: Server-side totals for the storefront checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200": { description: Preview totals, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderPreview" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /orders:
    post:
      operationId: createOrder
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /orders/{id}/payment:
    post:
      operationId: startOrderPayment
      tags: [storefront]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentStartInput" }
      responses:
        "200": { description: Payment session, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStart" } } } }
        "503": { description: Payment provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStart" } } } }
  /orders/{id}:
    get:
      operationId: getOrderDetails
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /guest/orders/{id}/{token}:
    get:
      operationId: getGuestOrderDetails
      tags: [storefront]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Guest order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /orders/{id}/receipt.pdf:
    get:
      operationId: getOrderReceipt
      tags: [storefront]
      description: Requires the authenticated order owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Private order result, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: Order not found or access denied }
  /orders/{id}/confirmation:
    get:
      operationId: getOrderConfirmation
      tags: [storefront]
      description: Requires the authenticated order owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Private order result, content: { application/json: { schema: { $ref: "#/components/schemas/OrderConfirmation" } } } }
        "404": { description: Order not found or access denied }
  /guest/orders/{id}/{token}/receipt.pdf:
    get:
      operationId: getGuestOrderReceipt
      tags: [storefront]
      description: Requires the private guest token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Private order result, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: Order not found or access denied }
  /guest/orders/{id}/{token}/confirmation:
    get:
      operationId: getGuestOrderConfirmation
      tags: [storefront]
      description: Requires the private guest token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Private order result, content: { application/json: { schema: { $ref: "#/components/schemas/OrderConfirmation" } } } }
        "404": { description: Order not found or access denied }
  /me:
    get:
      operationId: getMe
      tags: [storefront]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
    patch:
      operationId: updateMe
      tags: [storefront]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } }
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [storefront]
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: branchId, in: query, required: false, schema: { type: integer } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: Filter by scheduledStart >= from }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: Filter by scheduledStart < to }
        - { name: fulfillmentMethod, in: query, required: false, schema: { type: string, enum: [pickup, delivery] } }
        - { name: orderSource, in: query, required: false, schema: { $ref: "#/components/schemas/OrderSource" } }
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
    post:
      operationId: createAdminOrder
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderInput" }
      responses:
        "201": { description: Order created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/orders/preview:
    post:
      operationId: previewAdminOrder
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderInput" }
      responses:
        "200": { description: Preview totals, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderPreview" } } } }
  /admin/customers/search:
    get:
      operationId: searchAdminCustomers
      tags: [admin]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: Customer matches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCustomerSearchHit" } } } } }
  /admin/coupons:
    get:
      operationId: listAdminCoupons
      tags: [admin]
      responses:
        "200": { description: Coupons, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Coupon" } } } } }
    post:
      operationId: createAdminCoupon
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
      responses:
        "201": { description: Coupon, content: { application/json: { schema: { $ref: "#/components/schemas/Coupon" } } } }
  /admin/payment-methods:
    get:
      operationId: listAdminPaymentMethods
      tags: [admin]
      responses:
        "200": { description: Payment method configs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PaymentMethodConfig" } } } } }
  /admin/payment-methods/{code}:
    patch:
      operationId: updateAdminPaymentMethod
      tags: [admin]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethodConfigUpdate" }
      responses:
        "200": { description: Updated config, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentMethodConfig" } } } }
        "400": { description: Invalid update, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /admin/payment-providers/{provider}:
    get:
      operationId: getAdminPaymentProvider
      tags: [admin]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider settings, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentProviderSettings" } } } }
        "404": { description: Unknown provider, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    put:
      operationId: updateAdminPaymentProvider
      tags: [admin]
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
