components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BranchHour:
      type: object
      properties:
        day:
          type: string
        label:
          type: string
        open:
          type: string
        close:
          type: string
        closed:
          type: boolean
        date:
          type: string
        slotOrder:
          type: integer
      required: [day, label, open, close, closed]
    BranchLink:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        label: { type: string }
        url: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
      required: [type, label, url]
    BranchImage:
      type: object
      properties:
        id: { type: integer }
        url: { type: string }
        type: { type: string, enum: [hero, gallery, logo, card] }
        alt: { type: ["string", "null"] }
        sortOrder: { type: integer }
        active: { type: boolean }
      required: [url, type]
    BranchSpecialHour:
      type: object
      properties:
        id: { type: integer }
        date: { type: string }
        openTime: { type: ["string", "null"] }
        closeTime: { type: ["string", "null"] }
        closed: { type: boolean }
        label: { type: ["string", "null"] }
      required: [date, closed]
    Branch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        shortName:
          type: string
        shortDescription:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        address:
          type: string
        street:
          type: ["string", "null"]
        externalNumber:
          type: ["string", "null"]
        internalNumber:
          type: ["string", "null"]
        neighborhood:
          type: string
        borough:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        placeId:
          type: ["string", "null"]
        phone:
          type: string
        secondaryPhone:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        whatsappDefaultMessage:
          type: ["string", "null"]
        email:
          type: string
        ordersEmail:
          type: ["string", "null"]
        reservationsEmail:
          type: ["string", "null"]
        mapsUrl:
          type: string
        openTableUrl:
          type: ["string", "null"]
        instagramUrl:
          type: ["string", "null"]
        reservationProvider:
          type: string
          enum: [opentable, external, none]
        reservationUrl:
          type: ["string", "null"]
        reservationCta:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        gallery:
          type: array
          items:
            type: string
        hours:
          type: array
          items:
            $ref: "#/components/schemas/BranchHour"
        pickupAvailable:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: ["number", "null"]
        minimumOrder:
          type: ["number", "null"]
        freeDeliveryFrom:
          type: ["number", "null"]
        preparationTimeMinutes:
          type: integer
        deliveryTimeMinutes:
          type: integer
        featured:
          type: boolean
        seoTitle:
          type: ["string", "null"]
        metaDescription:
          type: ["string", "null"]
        ogImageUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, archived]
        active:
          type: boolean
      required:
        - id
        - name
        - slug
        - shortName
        - description
        - address
        - neighborhood
        - borough
        - city
        - state
        - postalCode
        - country
        - latitude
        - longitude
        - phone
        - whatsapp
        - email
        - mapsUrl
        - openTableUrl
        - instagramUrl
        - imageUrl
        - gallery
        - hours
        - pickupAvailable
        - deliveryAvailable
        - deliveryRadiusKm
        - minimumOrder
        - preparationTimeMinutes
        - deliveryTimeMinutes
        - active
    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/ProductCard"
          required: [products]
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        productCount:
          type: integer
      required: [id, name, slug, description, imageUrl, productCount]
    BranchAvailability:
      type: object
      properties:
        branchId:
          type: integer
        branchSlug:
          type: string
        branchName:
          type: string
        available:
          type: boolean
        inventory:
          type: integer
        minStock:
          type: integer
        criticalStock:
          type: ["integer", "null"]
        autoAlertEnabled:
          type: boolean
        alertState:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        preparationTimeMinutes:
          type: integer
        pickupAvailable:
          type: boolean
        deliveryAvailable:
          type: boolean
        physicalStock:
          type: integer
        reservedStock:
          type: integer
        availableStock:
          type: integer
        priceOverride:
          type: ["number", "null"]
        salePriceOverride:
          type: ["number", "null"]
        promotion:
          oneOf:
            - $ref: "#/components/schemas/Promotion"
            - type: "null"
      required:
        - branchId
        - branchSlug
        - branchName
        - available
        - inventory
        - price
        - salePrice
        - preparationTimeMinutes
        - pickupAvailable
        - deliveryAvailable
        - promotion
    ProductVariant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: string
        sku:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
      required: [id, name, value, sku, price, salePrice]
    ProductCard:
      type: object
      properties:
        id:
